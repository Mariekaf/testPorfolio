<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studio — Administration du portfolio</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body>
<div id="login-screen" class="login-screen"><a href="/" class="wordmark">Marie<span>✳</span></a><form id="login-form" class="login-card"><span class="eyebrow">VOTRE ESPACE PERSONNEL</span><h1>Bienvenue au studio.</h1><p>Un espace pour faire vivre votre portfolio, à votre rythme.</p><label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrer dans mon studio ↗</button><p id="login-error" role="alert"></p></form><a href="/" class="muted">← Revenir au portfolio</a></div>
