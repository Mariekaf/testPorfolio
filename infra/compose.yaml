name: portfolio-core001
services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    env_file: env/development.local.env
    ports:
      - "127.0.0.1:${SAAS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_core001:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
volumes:
  postgres_core001:
